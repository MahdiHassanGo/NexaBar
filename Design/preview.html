<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexaBar — design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeedf2;color:#22212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{padding:40px 30px;max-width:1080px;margin:auto}h1{font-size:26px;font-weight:550;letter-spacing:-.8px;margin:0 0 8px}main>p{color:#72707e;font-size:13px;margin:0 0 28px}.panels{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}.label{font-size:10px;color:#777584;text-transform:uppercase;letter-spacing:2px;margin:0 0 12px 4px}.panel{--ink:#292733;--muted:#7b7787;--line:rgba(40,34,65,.075);--card:rgba(255,255,255,.88);--soft:rgba(42,34,65,.04);--accent:#7663cf;--mint:#46a38c;--amber:#d6964f;width:404px;height:610px;border:1px solid rgba(20,10,40,.09);border-radius:20px;background:linear-gradient(130deg,#f1eff8,#f7f6f9 55%);box-shadow:0 20px 65px #332c5214;overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}.panel.dark{--ink:#eeedf5;--muted:#a8a3b5;--line:rgba(255,255,255,.07);--card:#25242d;--soft:rgba(255,255,255,.045);--accent:#b0a0f5;--mint:#78c6b0;--amber:#dca76c;background:linear-gradient(130deg,#262330,#1d1d24 60%);box-shadow:0 20px 65px #201a3440}header{display:flex;align-items:center;gap:11px;padding:19px 20px 17px}header img{width:39px;height:39px;border-radius:12px}header h2{font-size:18px;font-weight:600;letter-spacing:-.4px;margin:0 0 3px}header p{font-size:10.5px;color:var(--muted);margin:0}.live{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--mint);background:color-mix(in srgb,var(--mint) 9%,transparent);border-radius:20px;padding:5px 9px;font-size:10px}.live:before{content:'';width:5px;height:5px;background:var(--mint);border-radius:50%}nav{display:flex;gap:3px;padding:4px;margin:0 18px 15px;background:var(--soft);border-radius:14px}button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 0;font-size:10.5px;color:var(--muted);border-radius:10px}nav button.active{background:var(--card);color:var(--accent)}svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.content{flex:1;min-height:0;overflow:auto;padding:0 18px 18px;scrollbar-width:none}.section{display:flex;align-items:center;justify-content:space-between;margin:0 2px 16px;font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:600;text-transform:uppercase}.section small{font-weight:400;letter-spacing:0;text-transform:none;font-size:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.gauges{display:flex;padding:19px 10px;margin-bottom:16px;gap:8px}.gauge{flex:1;text-align:center}.ring{position:relative;width:74px;height:74px;margin:auto}.ring svg{width:74px;height:74px;transform:rotate(-90deg);stroke-width:4}.ring .track{stroke:color-mix(in srgb,var(--tone) 11%,transparent)}.ring .value{stroke:var(--tone);stroke-dasharray:var(--dash) 207.35}.ring .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.center svg{transform:none;width:11px;height:11px;stroke-width:1.5;color:var(--muted)}.center b{font-size:18px;font-weight:500;letter-spacing:-.5px}.gauge .name{font-size:11px;font-weight:500;margin:9px 0}.gauge .sub{font-size:9px;color:var(--muted)}.metrics{display:flex;gap:8px;margin-bottom:16px}.metric{flex:1;padding:12px;min-width:0}.metric svg{display:block;margin-bottom:8px;color:var(--tone);width:12px;height:12px}.metric b{display:block;font-size:13px;font-weight:500;line-height:16px}.metric span{display:block;font-size:9.5px;color:var(--muted);margin-top:8px}.actions{display:flex;gap:10px;margin-bottom:16px}.action{flex:1;text-align:left;padding:13px;display:flex;align-items:center;gap:10px}.iconbox{display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:11px;background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--accent)}.iconbox svg{width:17px;height:17px;stroke-width:1.4}.action b,.sound-summary b{display:block;font-size:12px;font-weight:500}.action small,.sound-summary small{display:block;font-size:9.5px;color:var(--muted);margin-top:4px}.sound-summary{padding:14px;display:flex;align-items:center;gap:10px}.sound-summary>svg{color:var(--accent)}.iconbutton{width:29px;height:29px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);margin-left:auto}footer{display:flex;align-items:center;gap:6px;padding:11px 20px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);background:rgba(0,0,0,.015)}kbd{font:500 10px ui-monospace,monospace;border-radius:5px;padding:4px 6px;background:var(--soft)}footer .right{margin-left:auto;display:flex;gap:16px;align-items:center}footer .right svg{width:13px}.sound-card{padding:14px;margin-bottom:16px}.sound-row+.sound-row{margin-top:18px}.row-title{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;font-weight:500}.row-title .selected{margin-left:auto;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);padding:4px 7px;border-radius:20px;font-size:9px}.volume{display:flex;align-items:center;gap:10px}.volume input{flex:1;min-width:0;accent-color:#8a76d6;height:4px}.volume span{font-size:10px;color:var(--muted);width:32px;text-align:right;font-variant-numeric:tabular-nums}.volume .iconbutton{margin:0}.clipboard-head{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-bottom:12px}.clipboard-head button{font-size:10.5px;color:var(--muted)}.search{display:flex;gap:8px;align-items:center;padding:11px;background:var(--soft);border-radius:11px;margin-bottom:12px;color:var(--muted)}.search input{border:0;outline:none;background:none;color:var(--ink);font-size:12px;font-family:inherit;width:100%;min-width:0}.filters{display:flex;align-items:center;gap:6px;margin-bottom:13px}.filters button{font-size:10.5px;border-radius:20px;padding:6px 11px;color:var(--muted)}.filters .active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}.filters span{font-size:10px;color:var(--muted);margin-left:auto}.copy-row{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px}.copy-row .text{flex:1;min-width:0;font-size:12px;line-height:17px;text-align:left}.copy-row .text small{display:block;color:var(--muted);font-size:9.5px;margin-top:5px}.copy-row .text p{margin:0}.copy-row .delete{color:var(--muted)}.settings-card{padding:16px;margin-bottom:16px}.setting-name{font-size:12px;font-weight:500;margin-bottom:15px}.segmented{display:flex;background:var(--soft);border-radius:7px;padding:3px;margin-bottom:15px}.segmented button{flex:1;font-size:11px;padding:5px;border-radius:5px}.segmented .active{background:var(--card);box-shadow:0 1px 3px #00000015}hr{border:0;border-top:1px solid var(--line);margin:15px 0}.settings-card p{font-size:10.5px;line-height:16px;color:var(--muted);margin:0}.launch{display:flex;align-items:center;justify-content:space-between}.launch input{accent-color:#8a76d6}.btn{padding:9px 12px;background:var(--soft);border-radius:11px;font-size:12px}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--card);padding:10px 14px;border:1px solid var(--line);border-radius:20px;font-size:11px;box-shadow:0 4px 14px #0002;z-index:5;white-space:nowrap}.panel{position:relative}.note{margin:24px auto 0;text-align:center;font-size:11px;color:#777584;line-height:19px}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:12px}button:hover{filter:brightness(.96)}.dark button:hover{filter:brightness(1.1)}
</style></head><body><main><h1>A little space. A clearer day.</h1><p>NexaBar · Minimal UI refresh</p><div class="panels"><div><div class="label">Light appearance</div><div class="panel" id="light"></div></div><div><div class="label">Dark appearance</div><div class="panel dark" id="dark"></div></div></div><div class="note">Interactive design reference with sample values. Native SwiftUI files are included in the project.<br>Choose a tab to explore. Audio sliders and clipboard interactions here are demonstrations.</div></main>
<script>
const symbols={grid:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="13" y="3" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><rect x="13" y="13" width="6" height="6" rx="1"/>',sound:'<path d="M10 5 5 9H2v6h3l5 4z"/><path d="M14 8a6 6 0 0 1 0 8M17 5a10 10 0 0 1 0 14"/>',clipboard:'<rect x="5" y="4" width="13" height="16" rx="2"/><rect x="8" y="2" width="7" height="4" rx="1"/><path d="M9 10h6M9 14h6"/>',settings:'<path d="M2 5h18M2 11h18M2 17h18"/><circle cx="7" cy="5" r="2" fill="var(--card)"/><circle cx="15" cy="11" r="2" fill="var(--card)"/><circle cx="9" cy="17" r="2" fill="var(--card)"/>',cpu:'<rect x="5" y="5" width="12" height="12" rx="2"/><rect x="8" y="8" width="6" height="6"/><path d="M8 2v3M14 2v3M8 17v3M14 17v3M2 8h3M2 14h3M17 8h3M17 14h3"/>',memory:'<rect x="3" y="6" width="16" height="10" rx="2"/><path d="M6 9h2v4H6zM10 9h2v4h-2zM14 9h2v4h-2zM6 16v3M10 16v3M14 16v3M18 16v3"/>',disk:'<path d="m5 4-3 12h18L17 4z"/><rect x="2" y="13" width="18" height="6" rx="2"/><path d="M14 16h3"/>',temp:'<path d="M9 5a2 2 0 0 1 4 0v8a4 4 0 1 1-4 0zM11 7v9"/>',down:'<path d="M11 3v15M6 13l5 5 5-5"/>',up:'<path d="M11 18V3M6 8l5-5 5 5"/>',capture:'<path d="M8 3H3v5M14 3h5v5M19 14v5h-5M8 19H3v-5"/><rect x="7" y="7" width="8" height="8" rx="1"/>',arrow:'<path d="M6 16 16 6M6 6h10v10"/>',pulse:'<path d="M1 11h4l3-7 4 14 3-7h6"/>',search:'<circle cx="9" cy="9" r="6"/><path d="m14 14 6 6"/>',text:'<path d="M3 5h17M3 9h12M3 13h17M3 17h9"/>',copy:'<rect x="3" y="7" width="12" height="13" rx="2"/><path d="M8 7V2h12v13h-5"/>',trash:'<path d="M3 6h16M8 6V3h6v3M5 6l1 14h10l1-14M9 9v7M13 9v7"/>'};
const icon=n=>`<svg viewBox="0 0 22 22" aria-hidden="true">${symbols[n]||symbols.grid}</svg>`;
const names=['Overview','Sound','Clipboard','Settings'], keys=['grid','sound','clipboard','settings'];
let copies=[{type:'text',text:'Small steps. Clear focus. Keep moving.',time:'2 minutes ago'},{type:'text',text:'https://github.com/MahdiHassanGo/NexaBar',time:'5 minutes ago'},{type:'image',text:'Copied image · 1440 × 900 · 246 KB',time:'12 minutes ago'},{type:'text',text:'Review the project, then make space for the next idea.',time:'18 minutes ago'}];
function init(id){const p=document.getElementById(id);p.dataset.tab='Overview';p.innerHTML=`<header><img src="../Sources/NexaBar/AppIcon.png" alt=""><div><h2>NexaBar</h2><p>A little space. A clearer day.</p></div><span class="live">Live</span></header><nav>${names.map((n,i)=>`<button data-tab="${n}" class="${i===0?'active':''}">${icon(keys[i])}${n}</button>`).join('')}</nav><div class="content"></div><footer><button data-tab="Clipboard"><kbd>⌘⇧V</kbd> Clipboard</button><span class="right">${icon('pulse')}<button data-demo="Quit is available in the native app">Quit</button></span></footer>`;render(p);}
function heading(t,d=''){return `<div class="section">${t}<small>${d}</small></div>`}
function gauge(n,key,v,detail,tone){return `<div class="gauge"><div class="ring" style="--tone:var(--${tone});--dash:${207.35*v/100}"><svg viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="33"/><circle class="value" cx="37" cy="37" r="33"/></svg><div class="center">${icon(key)}<b>${v}%</b></div></div><div class="name">${n}</div><div class="sub">${detail}</div></div>`}
function metric(n,key,v,tone){return `<div class="metric card" style="--tone:var(--${tone})">${icon(key)}<b>${v}</b><span>${n}</span></div>`}
function overview(){return heading('Your Mac, at a glance','Updates every 2s')+`<div class="card gauges">${gauge('CPU','cpu',24,'Live usage','accent')}${gauge('Memory','memory',61,'9.8 GB / 16 GB','mint')}${gauge('Storage','disk',72,'164 GB / 228 GB','amber')}</div><div class="metrics">${metric('Temperature','temp','49 °C','amber')}${metric('Download','down','1.2 M/s','mint')}${metric('Upload','up','248 K/s','accent')}</div>`+heading('Make room for your next idea')+`<div class="actions"><button class="action card" data-demo="Capture opens the native screen selector"><span class="iconbox">${icon('capture')}</span><span><b>Capture</b><small>Select & copy</small></span></button><button class="action card" data-tab="Clipboard"><span class="iconbox">${icon('clipboard')}</span><span><b>Clipboard</b><small>${copies.length} saved items</small></span></button></div><div class="sound-summary card">${icon('sound')}<span><b>Sound, in your control</b><small>MacBook Air Speakers</small></span><button class="iconbutton" data-tab="Sound" aria-label="Open sound controls">${icon('arrow')}</button></div>`}
function audioRow(name,v,selected=false){return `<div class="sound-row"><div class="row-title"><span class="iconbox">${icon('sound')}</span>${name}${selected?'<span class="selected">Selected</span>':''}</div><div class="volume"><button class="iconbutton mute" aria-label="Toggle mute">${icon('sound')}</button><input type="range" min="0" max="100" value="${v}" aria-label="${name} volume"><span>${v}%</span></div></div>`}
function sound(){return heading('Output devices','Select to switch')+`<div class="card sound-card">${audioRow('MacBook Air Speakers',68,true)}${audioRow('AirPods Pro',42)}</div>`+heading('App volume','2 active')+`<div class="card sound-card">${audioRow('Spotify',54)}${audioRow('Brave Browser',35)}</div>`}
function clipboard(){return `<div class="clipboard-head">Your recent copies<button data-demo="Clear history requires confirmation in the native app">Clear all</button></div><label class="search">${icon('search')}<input placeholder="Find something you copied…" aria-label="Search clipboard"></label><div class="filters"><button class="active" data-filter="All">All</button><button data-filter="Text">Text</button><button data-filter="Images">Images</button><span class="count">${copies.length} items</span></div><div class="copies"></div>`}
function settings(p){return heading('Make it yours')+`<div class="settings-card card"><div class="setting-name">Appearance</div><div class="segmented theme"><button data-theme="system">System</button><button data-theme="light" class="${!p.classList.contains('dark')?'active':''}">Light</button><button data-theme="dark" class="${p.classList.contains('dark')?'active':''}">Dark</button></div><hr><div class="setting-name">Menu bar</div><div class="segmented layout"><button class="active" data-layout="compact">Compact</button><button data-layout="balanced">Balanced</button></div><p class="layout-detail">CPU and memory. More room in your menu bar.</p></div>`+heading('Ready when you are')+`<div class="settings-card card launch"><div><div class="setting-name" style="margin:0 0 4px">Launch at login</div><p>Keep your tools one click away.</p></div><input type="checkbox" checked aria-label="Launch at login"></div><div class="settings-card card"><div class="setting-name">Software updates <span style="float:right;color:var(--muted);font-size:10px">v3.0.1</span></div><p>You're up to date.</p><div style="display:flex;align-items:center;justify-content:space-between;margin-top:13px;font-size:11px"><label><input type="checkbox" checked> Automatic checks</label><button class="btn" data-demo="Preview: you're up to date">Check now</button></div></div>`}
function render(p){p.querySelectorAll('nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===p.dataset.tab));const c=p.querySelector('.content');c.innerHTML=p.dataset.tab==='Overview'?overview():p.dataset.tab==='Sound'?sound():p.dataset.tab==='Clipboard'?clipboard():settings(p);c.scrollTop=0;if(p.dataset.tab==='Clipboard')filterCopies(p);}
function filterCopies(p){const q=p.querySelector('.search input').value.toLowerCase(), f=p.querySelector('[data-filter].active').dataset.filter;const list=copies.filter(x=>(f==='All'||(f==='Text'&&x.type==='text')||(f==='Images'&&x.type==='image'))&&x.text.toLowerCase().includes(q));p.querySelector('.count').textContent=`${list.length} items`;p.querySelector('.copies').innerHTML=list.map(x=>`<div class="copy-row card"><span class="iconbox">${icon(x.type==='text'?'text':'capture')}</span><button class="text" data-demo="Preview: item copied"><p>${x.text}</p><small>${x.time}</small></button><button class="iconbutton" data-demo="Preview: item copied" aria-label="Copy item">${icon('copy')}</button><button class="delete" data-demo="Preview: delete is available in the native app" aria-label="Delete item">${icon('trash')}</button></div>`).join('')||'<div class="card empty">Nothing found. Try another search or filter.</div>'}
function toast(p,t){p.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;p.append(el);setTimeout(()=>el.remove(),2000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.closest('.panel');if(!p)return;if(b.dataset.tab){p.dataset.tab=b.dataset.tab;render(p)}if(b.dataset.demo)toast(p,b.dataset.demo);if(b.dataset.filter){p.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));filterCopies(p)}if(b.dataset.theme){p.classList.toggle('dark',b.dataset.theme==='dark'||b.dataset.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);render(p)}if(b.dataset.layout){p.querySelectorAll('[data-layout]').forEach(x=>x.classList.toggle('active',x===b));p.querySelector('.layout-detail').textContent=b.dataset.layout==='compact'?'CPU and memory. More room in your menu bar.':'CPU, memory, storage and download speed.'}if(b.classList.contains('mute')){b.classList.toggle('muted');b.style.opacity=b.classList.contains('muted')?'.4':'1'}});
document.addEventListener('input',e=>{const p=e.target.closest('.panel');if(e.target.type==='range')e.target.nextElementSibling.textContent=e.target.value+'%';if(e.target.closest('.search'))filterCopies(p)});init('light');init('dark');
</script></body></html>
